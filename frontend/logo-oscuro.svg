<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">Hilvana Chat</title>
  <!-- La marca para fondos oscuros (la barra superior): dos paredes que forman una H y un bocadillo entre ellas -->
  <defs>
    <linearGradient id="paredes" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbd1ec"/><stop offset="1" stop-color="#b2bfde"/>
    </linearGradient>
    <linearGradient id="bocadillo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8ebf6"/><stop offset="1" stop-color="#cecfeb"/>
    </linearGradient>
    <!-- Hueco entre el bocadillo y las paredes (transparente: funciona sobre cualquier fondo) -->
    <mask id="hueco" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#fff"/>
      <path d="M79 38H41a11 11 0 0 0-11 11v19l-5 15 16-7h38a11 11 0 0 0 11-11V49a11 11 0 0 0-11-11z"
            fill="#000" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#hueco)" fill="url(#paredes)">
    <rect x="18" y="14" width="26" height="92" rx="11"/>
    <rect x="76" y="14" width="26" height="92" rx="11"/>
  </g>
  <path d="M79 38H41a11 11 0 0 0-11 11v19l-5 15 16-7h38a11 11 0 0 0 11-11V49a11 11 0 0 0-11-11z" fill="url(#bocadillo)"/>
  <!-- «Escribiendo…»: los tres puntos, de claro a oscuro -->
  <rect x="44.5" y="53.5" width="7" height="7" rx="2.2" fill="#a3acd9"/>
  <rect x="56.5" y="53.5" width="7" height="7" rx="2.2" fill="#7978bd"/>
  <rect x="68.5" y="53.5" width="7" height="7" rx="2.2" fill="#4f4e96"/>
</svg>
